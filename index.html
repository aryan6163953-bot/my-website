<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #111827;
        }

        nav h2 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        section {
            padding: 70px 8%;
            text-align: center;
        }

        section h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .card {
            max-width: 700px;
            margin: auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <nav>
        <h2>My Portfolio</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
        </div>
    </nav>


    <section class="hero" id="home">

        <h1>Hello, I'm <span>Aryan</span> 👋</h1>

        <p>Welcome to my personal website 🚀</p>

        <a href="#about" class="btn">Explore More</a>

    </section>


    <section id="about">

        <h2>About Me</h2>

        <div class="card">
            <p>
                Hi! I'm Aryan. This is my first personal website
                created using HTML, CSS and GitHub Pages.
            </p>
        </div>

    </section>


    <section id="skills">

        <h2>My Skills</h2>

        <div class="card">
            <p>💻 HTML</p>
            <p>🎨 CSS</p>
            <p>📊 MS Excel</p>
            <p>🐍 Programming</p>
        </div>

    </section>


    <footer>
        © 2026 Aryan | My Portfolio
    </footer>

</body>
</html>
